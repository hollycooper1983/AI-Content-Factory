name: BookNoble CI

on:
  push:
    paths: ['booknoble/**', '.github/workflows/booknoble-ci.yml']
  pull_request:
    paths: ['booknoble/**']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: booknoble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: booknoble/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx expo export --platform web

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration and run RLS / booking tests
        working-directory: booknoble
        run: |
          createdb bn
          psql -d bn -v ON_ERROR_STOP=1 -q -f supabase/tests/supabase_stub.sql
          psql -d bn -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261025000000_init.sql
          psql -d bn -f supabase/tests/rls_and_booking.sql
